name: Verifier la version de travail

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v5

      - name: Installer Zola
        run: |
          curl -L https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz -o zola.tar.gz
          tar -xzf zola.tar.gz
          chmod +x zola
          sudo mv zola /usr/local/bin/zola

      - name: Compiler sans publier
        run: zola build

      - name: Conserver la version compilee comme artefact de controle
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-des-frontignes-mobile
          path: ./public
          retention-days: 7
